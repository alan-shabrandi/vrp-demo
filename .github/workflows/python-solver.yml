name: Python Solver CI

on:
  push:
    branches: [main]
    paths:
      - "packages/vrp-solver/**"
      - ".github/workflows/python-solver.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/vrp-solver/**"
      - ".github/workflows/python-solver.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vrp-solver

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest -v
